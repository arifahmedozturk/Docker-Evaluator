[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docker-evaluator"
version = "0.1.0"
description = "Generic code evaluation in isolated Docker containers"
requires-python = ">=3.9"
dependencies = [
    "docker>=7.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docker_evaluator*"]

[tool.setuptools.package-data]
docker_evaluator = [
    "language_helpers/*/Dockerfile",
    "language_helpers/*/entrypoint.sh",
]
